services:
  opencode-proxy:
    container_name: opencode-proxy
    build: .
    deploy:
      resources:
        limits:
          cpus: '3'
          memory: 8G

    # Internal only — Headroom connects via Docker network.
    # Not exposed on host; clients use Headroom:8787 instead.
    # To access the proxy directly (bypassing Headroom), add:
    #   ports:
    #     - "8080:8080"
    env_file: .env
    ports:
      - "8787:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped



  # claude-mem memory service (optional) — persistent cross-session memory server.
  # Service runs worker on port 37777 and saves memory database to claude-mem-data volume.
  claude-mem:
    image: node:20-slim
    command: npx -y @thedotmack/claude-mem-server@latest
    ports:
      - "37777:37777"
    environment:
      - PORT=37777
    volumes:
      - claude-mem-data:/root/.claude-mem
    restart: unless-stopped
    profiles:
      - with-claude-mem

volumes:

  claude-mem-data:
